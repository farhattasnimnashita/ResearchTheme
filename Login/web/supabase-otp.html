<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email verification | ResearchTheme</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/supabase-otp.css"><script src="/assets/supabase-otp.js" defer></script></head><body><main class="otp-card"><a href="/">ResearchTheme</a><h1 id="title">Verify your email</h1><p id="intro">Enter the code from your email.</p><p id="status" role="status" aria-live="polite"></p><form id="otp-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label id="code-field">Email code<input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required></label><label id="password-field" hidden>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72"></label><button type="submit" id="submit">Verify email</button></form><button type="button" id="resend">Resend verification code</button><p><a href="/">Back to login</a> · <a href="/reset-password" id="have-code" hidden>I have a recovery code</a></p></main></body></html>
